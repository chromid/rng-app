<!DOCTYPE html><html lang="pl" data-theme="auto"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"><title>Losowanie</title><link rel="stylesheet" href="css/style.css"></head><body><div class="app"><nav class="tabs" id="tabs"><span class="pill" id="pill"></span><button class="tab active" data-tab="wheel">Koło</button><button class="tab" data-tab="options">Opcje</button><button class="tab" data-tab="look">Wygląd</button><button class="tab" data-tab="quick">Losowanie</button></nav><section class="panel" id="tab-wheel"><h2 id="wheelTitle"></h2><div class="stage" id="stage" role="button" tabindex="0" aria-label="Zakręć kołem"><div class="wheel" id="wheel"></div><div class="pointer" id="pointer"><svg class="arrow" viewBox="0 0 8 6.93" aria-hidden="true"><polygon points="0,0 8,0 4,6.93"/></svg></div><div class="hub"></div></div><p class="muted" id="wheelNotice" hidden></p><div class="spin-row"><button class="spin" id="spin" aria-label="Zakręć"><span>↻</span></button><div class="result live" id="live" aria-hidden="true" hidden></div><div id="result" aria-live="polite" style="width: 100%"></div><button class="btn" id="restore" hidden>Przywróć koło</button><div class="history" id="history" hidden><div class="history-head"><span>Historia</span><button class="icon" id="clearHistory" title="Wyczyść historię" aria-label="Wyczyść historię">×</button></div><div class="history-list" id="historyList"></div></div></div></section><section class="panel" id="tab-options" hidden><input type="text" id="titleInput" placeholder="Tytuł koła" maxlength="200"><h3>Opcje</h3><div id="optionList"></div><textarea id="bulk" placeholder="Jedna opcja w linii" hidden></textarea><div class="bar"><button class="btn primary" id="addOption">+ Dodaj</button><button class="btn" id="shuffle">Przemieszaj</button><button class="btn" id="toggleBulk">Tryb tekstowy</button><button class="btn" id="clearOverrides">Wyczyść nadpisania</button></div><h3>Generator</h3><div class="gen"><select id="genType" title="Rodzaj generowanych opcji"><option value="numbers">Liczby</option><option value="letters">Litery</option></select><span class="gen" id="genNumbers"><input type="number" id="genFrom" value="1" placeholder="Od" title="Pierwsza liczba" aria-label="Od"><input type="number" id="genTo" value="10" placeholder="Do" title="Ostatnia liczba" aria-label="Do"><input type="number" id="genStep" value="1" min="1" placeholder="Krok" title="Krok, czyli różnica między kolejnymi liczbami" aria-label="Krok"><label class="gen" title="Uzupełnij zerami do równej długości, np. 01, 02, 10"><input type="checkbox" id="genPad"> Zera wiodące</label></span><span class="gen" id="genLetters" hidden><select id="genAlphabet" title="Alfabet" aria-label="Alfabet"></select><select id="genLetterFrom" title="Pierwsza litera" aria-label="Od"></select><select id="genLetterTo" title="Ostatnia litera" aria-label="Do"></select></span></div><div class="bar"><button class="btn primary" id="genAdd">Dodaj do listy</button><button class="btn" id="genReplace">Zastąp listę</button></div><h3>Import i eksport</h3><textarea id="exportBox" spellcheck="false" aria-label="JSON"></textarea><p class="error" id="ioStatus" aria-live="polite" hidden></p><div class="bar"><button class="btn primary" id="importBtn">Importuj</button><button class="btn" id="copyJson">Kopiuj</button><button class="btn" id="downloadJson">Pobierz</button><button class="btn" id="loadFile">Wczytaj plik</button><button class="btn" id="copyLink">Kopiuj link</button><input type="file" id="fileInput" accept=".json,application/json" hidden></div><h3>Reset</h3><div class="bar"><button class="btn danger" id="resetAll" title="Usuwa zapisane ustawienia i historię losowań, po czym odświeża stronę">Zresetuj wszystko</button></div></section><section class="panel" id="tab-look" hidden><div class="field"><span>Motyw</span><div class="seg" id="themeSeg"><button class="btn" data-value="auto">Auto</button><button class="btn" data-value="light">Jasny</button><button class="btn" data-value="dark">Ciemny</button></div></div><div class="field"><span>Odcień</span><input type="range" class="hue" id="hue" min="0" max="360" step="1" aria-label="Odcień"></div><div class="field"><span>Nasycenie</span><input type="range" class="sat" id="saturation" min="0" max="150" step="1" aria-label="Nasycenie"><output id="saturationOut"></output></div><div class="field"><span>Wskaźnik</span><select id="pointerSelect"><option value="top">Góra</option><option value="right">Prawo</option><option value="bottom">Dół</option><option value="left">Lewo</option></select></div><label class="field" title="Strzałka wychodzi ze środka koła w stronę wybranej pozycji"><span>Od środka</span><input type="checkbox" id="pointerInside"></label><div class="field"><span>Kolor wskaźnika</span><input type="color" id="pointerColor" aria-label="Kolor wskaźnika"><label class="inline" title="Wskaźnik przyjmuje kolor wskazanej opcji"><input type="checkbox" id="pointerFollowsSlice"> Z wycinka</label><button class="btn" id="pointerColorAuto" hidden>Auto</button></div><label class="field" title="Tekst wskazanej opcji w miejscu wyniku, także podczas kręcenia"><span>Podgląd na żywo</span><input type="checkbox" id="liveLabel"></label><div class="field" title="Czas bazowy jednego losowania"><span>Czas</span><input type="range" id="duration" min="1" max="15" step="0.5"><output id="durationOut"></output></div><label class="field" title="Czas i liczba obrotów różnią się nieznacznie przy każdym losowaniu"><span>Losowe obroty</span><input type="checkbox" id="randomSpins"></label><label class="field" title="Historia losowań na kole i w szybkim losowaniu"><span>Historia</span><input type="checkbox" id="showHistory"></label><label class="field" title="Dźwięki i haptyka (jeśli dostępna na urządzeniu) w aplikacji"><span>Dźwięk</span><input type="checkbox" id="sound"></label><label class="field" title="Kliknięcie podczas kręcenia losuje od nowa i znów rozpędza koło"><span>Restart kliknięciem</span><input type="checkbox" id="restartable"></label><label class="field" title="Przeciągnij koło i puść, aby je rozkręcić; puszczone w bezruchu tylko się zatrzyma"><span>Obracanie przeciąganiem</span><input type="checkbox" id="dragSpin"></label><h3>Paleta</h3><div class="chips" id="chips"></div><div class="presets" id="presets"></div></section><section class="panel" id="tab-quick" hidden><div class="field"><span>Ile</span><input type="number" id="quickCount" value="1" min="1" style="max-width: 100px"><label class="field" style="margin: 0"><input type="checkbox" id="quickUnique" checked> bez powtórzeń</label></div><button class="btn primary" id="quickDraw" style="width: 100%">Losuj</button><div id="quickOut"></div><div class="bar"><button class="btn" id="quickRemove" hidden>Wyłącz z losowań</button><button class="btn" id="restoreQuick" hidden>Przywróć listę</button></div><div class="history spaced" id="quickHistory" hidden><div class="history-head"><span>Historia</span><button class="icon" id="clearQuickHistory" title="Wyczyść historię" aria-label="Wyczyść historię">×</button></div><div class="history-stack" id="quickHistoryList"></div></div></section></div><div class="toast" id="toast"></div><script src="js/script.js"></script></body></html>
